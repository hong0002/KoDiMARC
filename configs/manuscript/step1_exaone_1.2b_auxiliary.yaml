provenance:
  role: Auxiliary Step1 configuration for the EXAONE-4.0-1.2B comparison.

model:
  base_model: LGAI-EXAONE/EXAONE-4.0-1.2B
  dtype: float16
  device: null
  device_map: auto
  quant_type: 8bit
  max_length: 256
  num_labels: 7
  cls_loss_weight: 0.0
  contrastive_loss_weight: 0.0
  contrastive_temperature: 0.1
lora:
  enable: true
  rank: 64
  alpha: 128
  dropout: 0.0
data:
  train_path: data/processed/kowiki/dp_sft_train.jsonl
  valid_path: data/processed/kowiki/dp_sft_valid.jsonl
  max_length: 256
  max_samples: null
training:
  output_dir: outputs/step1_exaone_1.2b_auxiliary
  num_epochs: 1
  batch_size: 1
  gradient_accumulation: 16
  lr: 1.0e-05
  warmup_steps: 200
  save_steps: 1000
  logging_steps: 20
  seed: 42
  eval_steps: 1000
  dataloader_num_workers: 8
  logging_dir: logs
  gradient_checkpointing: false
  early_stopping_patience: 3
  early_stopping_threshold: 0.0
  load_best_model_at_end: true
