provenance:
  source_run_id: 20260319_182916__kakaocorp__kanana-1.5-8b-instruct-2505
  purpose: Earlier Step2 configuration retained for result provenance.

seed: 42
device: auto
paths:
  train_jsonl: data/processed/multitask_nli/final/train.jsonl
  dev_kornli_jsonl: data/processed/multitask_nli/final/dev_nli.jsonl
  dev_ai_jsonl: data/processed/multitask_nli/final/dev_logic.jsonl
  test_nli_jsonl: data/processed/multitask_nli/final/test_nli.jsonl
  test_logic_jsonl: data/processed/multitask_nli/final/test_logic.jsonl
  outputs_root: outputs
model:
  name: kakaocorp/kanana-1.5-8b-instruct-2505
  max_seq_length: 512
  use_marker_aware_head: false
  use_base_delta_head: false
  quant_type: 8bit
  device_map: auto
  dtype: bfloat16
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
marker:
  source: predicted
  topk_temperature: 0.7
  confidence_gating:
    enabled: false
    apply_train: true
    apply_eval: true
    temperature: 1.0
    min_top1_prob: 0.0
    min_top1_gap: 0.0
  dropout_nli_start: 0.3
  dropout_nli_end: 0.1
  dropout_logic_start: 0.7
  dropout_logic_end: 0.3
  dropout_unk_boost: 0.2
  corrupt_prob_nli: 0.05
  corrupt_prob_logic: 0.25
  logic_forbidden_categories:
    역접:
      - CAUSAL
      - COND
      - ADD
      - EXAMPLE
      - EXPLAN
    순접:
      - CONTRAST
      - CONCESS
      - CAUSAL
    양립:
      - CONTRAST
      - CONCESS
      - CAUSAL
      - COND
prompt:
  style: legacy
loss:
  lambda_kl: 0.7
  gamma_mrel: 0.2
  beta_supcon: 0.1
  supcon_temperature: 0.1
  supcon_forbidden_neg_weight: 2.0
  task_weight_nli: 1.0
  task_weight_logic: 1.0
  alpha_v2_ce: 0.0
  v2_ce_only_clean: true
  with_wrong_margin:
    weight: 0.0
    margin: 0.2
    only_clean: true
train:
  epochs: 1
  batch_size: 2
  grad_accum_steps: 8
  lr: 1.0e-05
  weight_decay: 0.0
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  mixed_precision: bf16
  log_every_steps: 20
  eval_every_steps: 1000
  early_stop_patience: 10
  early_stop_min_delta: 0.0
  supcon_queue:
    nli_size: 1024
    logic_size: 2048
    warmup_steps: 0
  task_ratio:
    nli: 3
    logic: 1
evaluation:
  enable_wrong_marker_eval: true
selection:
  metric: acc_weighted
  base_metric: acc
  gap_weight: 0.0
selection_weights:
  "no": 0.5
  with: 0.3
  wrong: 0.2
experiments:
  - name: full
    enable_kl: true
    enable_dropout: true
    enable_corruption: true
    enable_mrel: true
    enable_supcon: true
